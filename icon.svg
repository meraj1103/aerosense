<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Outer Glowing Sensor Arc -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="12" stroke-dasharray="1000" stroke-linecap="round"/>
  <path d="M 121.5 390.5 A 190 190 0 1 1 390.5 390.5" fill="none" stroke="url(#cloudGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Dust Particulate Orbit -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="8" stroke-dasharray="8 12"/>
  <circle cx="375" cy="175" r="12" fill="url(#dustGrad)" filter="url(#glow)"/>
  <circle cx="150" cy="200" r="8" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="340" cy="330" r="9" fill="#10b981" filter="url(#glow)"/>
  <circle cx="180" cy="320" r="6" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Central Cloud & Pulse Wave Icon -->
  <g transform="translate(136, 150) scale(10)">
    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>
  </g>

  <!-- Pulse Leaf / Sparkle Accent -->
  <circle cx="256" cy="390" r="14" fill="#10b981" filter="url(#glow)"/>
</svg>
